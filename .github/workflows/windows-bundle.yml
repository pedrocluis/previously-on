name: Windows bundle

# Builds the PyInstaller folder (packaging/previously-on.spec), proves it
# runs on a machine that never had the source checked out into a venv, and
# zips it. A tag v* also attaches the zip to a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build
        run: |
          uv sync --locked --no-dev --group bundle
          uv run --no-sync pyinstaller --noconfirm packaging/previously-on.spec
          Copy-Item LICENSE dist/PreviouslyOn/LICENSE.txt

      # The checks run from outside the repo so nothing resolves from src/.
      - name: Self-check (OCR models, window platform, WebView2, dxcam)
        working-directory: ${{ runner.temp }}
        run: |
          & "$env:GITHUB_WORKSPACE/dist/PreviouslyOn/previously-on.exe" check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Window starts and stays up
        working-directory: ${{ runner.temp }}
        run: |
          $p = Start-Process "$env:GITHUB_WORKSPACE/dist/PreviouslyOn/PreviouslyOn.exe" -PassThru
          Start-Sleep -Seconds 30
          $log = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter app.log -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*previously-on*' } | Select-Object -First 1
          if ($log) { Write-Host "--- $($log.FullName)"; Get-Content $log.FullName }
          if ($p.HasExited) { Write-Error "PreviouslyOn.exe exited with $($p.ExitCode)"; exit 1 }
          if ($log -and (Select-String -Path $log.FullName -Pattern 'Traceback' -Quiet)) {
            Write-Error "traceback in app.log"; exit 1
          }
          Stop-Process -Id $p.Id -Force

      - name: Zip
        id: zip
        run: |
          $version = uv run --no-sync python -c "import previously_on; print(previously_on.__version__)"
          $name = "PreviouslyOn-$version-windows-x64.zip"
          Compress-Archive -Path dist/PreviouslyOn -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT
          "{0:N0} MB unpacked, {1:N0} MB zipped" -f `
            ((Get-ChildItem dist/PreviouslyOn -Recurse | Measure-Object Length -Sum).Sum / 1MB), `
            ((Get-Item $name).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME --notes "" }
          gh release upload $env:GITHUB_REF_NAME "${{ steps.zip.outputs.name }}" --clobber
