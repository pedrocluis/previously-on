# Rebuild previouslyon.gg when a release is published: the site's download
# page reads the latest release at build time (../previously-on-web,
# src/data/release.ts). The tag workflow only drafts the release, so this
# fires on publish, not on the tag.
name: site rebuild

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy-hook:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger the Cloudflare build
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$SITE_DEPLOY_HOOK"
