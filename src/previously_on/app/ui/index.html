<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previously On</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="mark" href="#home">Previously on<span>…</span></a>
    <nav>
      <a href="#home" data-page="home">Recap</a>
      <a href="#sessions" data-page="sessions">Sessions</a>
      <a href="#timeline" data-page="timeline">Timeline</a>
      <a href="#search" data-page="search">Search</a>
      <a href="#settings" data-page="settings">Settings</a>
    </nav>
    <label class="game-pick">
      <span class="label">Showing</span>
      <select id="game" title="Which game's sessions to show"></select>
    </label>
    <div id="watch" class="watch"></div>
  </aside>
  <main id="main"><p class="loading">Loading…</p></main>
</div>
<script src="app.js"></script>
</body>
</html>
