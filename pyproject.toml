[project]
name = "previously-on"
version = "0.1.0"
description = "Passive session memory for long single-player games: watch the screen, log what happened, tell you where you left off."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mss>=9",
    "dxcam>=0.0.5; sys_platform == 'win32'",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.3",
    "psutil>=5.9",
    "rapidfuzz>=3",
    "platformdirs>=4",
    "anthropic>=1",
    "pydantic>=2",
    "openai>=2",
    "pywebview>=6",
    "pygobject>=3.50 ; sys_platform == 'linux'",
]

[project.scripts]
previously-on = "previously_on.cli:main"

[project.gui-scripts]
previously-on-app = "previously_on.app:main"


[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "pyyaml>=6",
]
# The Windows bundle: packaging/previously-on.spec
bundle = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/previously_on"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
# rapidocr-onnxruntime depends on the full opencv-python (Qt GUI build); we
# only need opencv-python-headless, and both install into the same cv2/
# folder. Dropping it keeps one cv2 and ~100 MB out of the Windows bundle.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
